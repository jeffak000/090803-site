# Decap CMS 配置 (https://decapcms.org/docs/)
# 后端：GitHub，鉴权走 Cloudflare Pages Functions（functions/api/auth.js + callback.js）
# 用 GitHub OAuth App 的 client_id / client_secret（存于 Pages 环境变量 GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET）
#
# 需在 GitHub 创建 OAuth App：
#   - Homepage URL:        https://www.090803.xyz
#   - Authorization callback URL: https://www.090803.xyz
# （若先用 pages.dev 预览，把 base_url 改成对应 pages.dev 地址）

backend:
  name: github
  repo: jeffak000/090803-site
  branch: main
  base_url: https://www.090803.xyz
  auth_endpoint: /api/auth

# 媒体资源存放位置（Hugo 会随 static/ 一起发布）
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# 发布设置：保存即提交到仓库，Cloudflare Pages 自动重建
publish_mode: simple

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, default: "" }
      - { name: draft, label: "草稿", widget: boolean, default: false }
      - { name: body, label: "正文", widget: markdown }

  - name: "pages"
    label: "页面"
    files:
      - name: "home"
        label: "首页"
        file: "content/_index.md"
        fields:
          - { name: title, label: "标题", widget: string }
          - { name: body, label: "正文", widget: markdown }
